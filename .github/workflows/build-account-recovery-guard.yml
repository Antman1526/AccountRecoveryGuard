name: Build Account Recovery Guard

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "account-recovery-guard/**"
      - ".github/workflows/build-account-recovery-guard.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: account-recovery-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      - run: python -m pytest -q

  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: account-recovery-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r requirements.txt -r requirements-build.txt

  macos-dmg:
    runs-on: macos-latest
    needs: [test, dependency-audit]
    defaults:
      run:
        working-directory: account-recovery-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: chmod +x scripts/build_macos_dmg.sh
      - run: scripts/build_macos_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AccountRecoveryGuard-macOS-dmg
          path: |
            account-recovery-guard/dist/AccountRecoveryGuard-macOS.dmg
            account-recovery-guard/dist/AccountRecoveryGuard-macOS.dmg.sha256
            account-recovery-guard/dist/AccountRecoveryGuard-macOS.manifest.json

  windows-exe:
    runs-on: windows-latest
    needs: [test, dependency-audit]
    defaults:
      run:
        working-directory: account-recovery-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - shell: pwsh
        run: scripts/build_windows_exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AccountRecoveryGuard-Windows-exe
          path: |
            account-recovery-guard/dist/AccountRecoveryGuard.exe
            account-recovery-guard/dist/AccountRecoveryGuard.exe.sha256
            account-recovery-guard/dist/AccountRecoveryGuard-Windows.manifest.json
            account-recovery-guard/dist/README-Windows.txt
