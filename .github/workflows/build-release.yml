name: Build Account Recovery Guard

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      - run: python -m pytest -q

  macos-dmg:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: chmod +x scripts/build_macos_dmg.sh
      - run: scripts/build_macos_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AccountRecoveryGuard-macOS-dmg
          path: |
            dist/AccountRecoveryGuard-macOS.dmg
            dist/AccountRecoveryGuard-macOS.dmg.sha256

  windows-exe:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - shell: pwsh
        run: scripts/build_windows_exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AccountRecoveryGuard-Windows-exe
          path: |
            dist/AccountRecoveryGuard.exe
            dist/AccountRecoveryGuard.exe.sha256
