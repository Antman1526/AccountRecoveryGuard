name: Build Account Recovery Guard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "account-recovery-guard/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: account-recovery-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      - run: python -m pytest -q

  macos-dmg:
    runs-on: macos-latest
    needs: test
    defaults:
      run:
        working-directory: account-recovery-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: chmod +x scripts/build_macos_dmg.sh
      - run: scripts/build_macos_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AccountRecoveryGuard-macOS-dmg
          path: account-recovery-guard/dist/AccountRecoveryGuard-macOS.dmg

  windows-exe:
    runs-on: windows-latest
    needs: test
    defaults:
      run:
        working-directory: account-recovery-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - shell: pwsh
        run: scripts/build_windows_exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AccountRecoveryGuard-Windows-exe
          path: account-recovery-guard/dist/AccountRecoveryGuard.exe
